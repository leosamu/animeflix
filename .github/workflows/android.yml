name: Android checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - name: Install Android SDK components
        shell: bash
        run: |
          sdk_root="$RUNNER_TEMP/android-sdk"
          archive="$RUNNER_TEMP/android-commandline.zip"
          curl --fail --location --retry 3 https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$archive"
          echo "4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  $archive" | sha256sum --check
          mkdir -p "$sdk_root/cmdline-tools"
          unzip -q "$archive" -d "$RUNNER_TEMP/android-commandline"
          mv "$RUNNER_TEMP/android-commandline/cmdline-tools" "$sdk_root/cmdline-tools/latest"
          echo "ANDROID_HOME=$sdk_root" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$sdk_root" >> "$GITHUB_ENV"
          echo "$sdk_root/platform-tools" >> "$GITHUB_PATH"
          echo "$sdk_root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          set +o pipefail
          yes | "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" --licenses > /dev/null
          set -o pipefail
          "$sdk_root/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$sdk_root" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Compile, test and lint mobile and TV
        run: bash ./gradlew --no-daemon :core:data:testDebugUnitTest :app-mobile:assembleDebug :app-mobile:lintDebug :app-tv:assembleDebug :app-tv:lintDebug :app-mobile:compileQaAndroidTestKotlin
      - name: Check TV iframe layout
        run: node scripts/test-tv-video-layout.cjs
      - name: Check provider media selection
        run: node scripts/test-provider-source.cjs
      - name: Save verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-reports
          path: |
            app-mobile/build/reports/
            app-tv/build/reports/
            core/data/build/reports/
          if-no-files-found: ignore
          retention-days: 14
